# Servicios del proyecto. Las credenciales salen del archivo .env (no versionado).
# Levantar:  docker compose up -d      Apagar:  docker compose down
# Borrar tambien los datos:  docker compose down -v

services:
  postgres:
    image: postgres:16
    container_name: bi_vinilos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BI_LECTOR_USER: ${BI_LECTOR_USER}                      # los usa sql/init/04_roles.sh
      BI_LECTOR_PASSWORD: ${BI_LECTOR_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data                      # persistencia de los datos
      - ./sql/init:/docker-entrypoint-initdb.d:ro            # DDL y semillas (solo la primera vez)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.0
    container_name: bi_vinilos_grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"                        # nadie se registra solo
      GF_AUTH_ANONYMOUS_ENABLED: "false"                     # acceso solo con usuario y contrasena
      GF_ALERTING_ENABLED: "false"                           # se usa la alerta unificada (la nueva)
      GF_UNIFIED_ALERTING_ENABLED: "true"
      # Variables que lee el provisioning de la fuente de datos (grafana/provisioning/datasources)
      POSTGRES_DB: ${POSTGRES_DB}
      BI_LECTOR_USER: ${BI_LECTOR_USER}                      # Grafana solo lee: usuario sin permisos de escritura
      BI_LECTOR_PASSWORD: ${BI_LECTOR_PASSWORD}
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana-data:/var/lib/grafana                        # persistencia de usuarios y estado
      - ./grafana/provisioning:/etc/grafana/provisioning:ro  # fuente de datos, tableros y alertas automaticos
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro  # tablero exportado (JSON)

volumes:
  pgdata:
  grafana-data:
