name: CI - Validacion de Features

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test-and-validate:
    name: Pruebas unitarias y validacion de codigo
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias del ETL
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt pytest

      - name: Validar compilacion de scripts Python
        run: |
          python -m compileall etl simulacion docs/informe

      - name: Ejecutar suite de pruebas unitarias
        run: |
          python -m pytest

      - name: Verificar que no se versionen archivos de credenciales (.env)
        run: |
          if [ -f .env ]; then
            echo "ERROR: El archivo .env no debe estar versionado."
            exit 1
          fi
