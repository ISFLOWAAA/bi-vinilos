<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <style>
      .caja { fill:#FFFFFF; stroke:#CBD5E1; stroke-width:1.5; rx:10; }
      .db   { fill:#F0FDFA; stroke:#0F766E; stroke-width:2; rx:10; }
      .t1   { font-size:15px; font-weight:600; fill:#0F172A; text-anchor:middle; }
      .t2   { font-size:11.5px; fill:#475569; text-anchor:middle; }
      .eti  { font-size:11px; fill:#64748B; text-anchor:middle; font-style:italic; }
      .tit  { font-size:12px; font-weight:600; fill:#0F766E; }
      .lin  { stroke:#64748B; stroke-width:1.6; fill:none; marker-end:url(#f); }
    </style>
  </defs>
  <rect width="1100" height="520" fill="#F8FAFC"/>

  <!-- FUENTE -->
  <text x="20" y="36" class="tit">1 · FUENTE</text>
  <rect class="caja" x="20" y="180" width="170" height="90"/>
  <text x="105" y="215" class="t1">Formato en papel</text>
  <text x="105" y="235" class="t2">"hora a hora"</text>
  <text x="105" y="252" class="t2">(operarias)</text>
  <rect class="caja" x="225" y="180" width="170" height="90"/>
  <text x="310" y="215" class="t1">Excel con macros</text>
  <text x="310" y="235" class="t2">.xlsm (mantenimiento)</text>
  <text x="310" y="252" class="t2">8.208 registros</text>
  <path class="lin" d="M190,225 L223,225"/>

  <!-- ETL -->
  <text x="430" y="36" class="tit">2 · ETL</text>
  <rect class="caja" x="430" y="165" width="190" height="120"/>
  <text x="525" y="198" class="t1">ETL en Python</text>
  <text x="525" y="220" class="t2">extraer · limpiar</text>
  <text x="525" y="237" class="t2">transformar · cargar</text>
  <text x="525" y="254" class="t2">validar contra la fuente</text>
  <text x="525" y="272" class="t2">(pandas, psycopg)</text>
  <path class="lin" d="M395,225 L428,225"/>

  <!-- DOCKER -->
  <rect x="650" y="150" width="430" height="190" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="664" y="170" class="tit">Docker Compose · un solo comando · volúmenes · variables de entorno</text>

  <!-- POSTGRES -->
  <rect class="db" x="670" y="185" width="190" height="140"/>
  <text x="765" y="213" class="t1">PostgreSQL 16</text>
  <text x="765" y="234" class="t2">dw · modelo estrella</text>
  <text x="765" y="251" class="t2">seguridad · datos personales</text>
  <text x="765" y="268" class="t2">calidad · incidencias</text>
  <text x="765" y="290" class="t2">3 hechos · 9 dimensiones</text>
  <text x="765" y="307" class="t2">fact_registro_horario</text>
  <path class="lin" d="M620,225 L668,225"/>
  <text x="644" y="214" class="eti">carga</text>

  <!-- GRAFANA -->
  <rect class="caja" x="900" y="205" width="160" height="100"/>
  <text x="980" y="238" class="t1">Grafana 11</text>
  <text x="980" y="258" class="t2">tablero + alerta</text>
  <text x="980" y="275" class="t2">provisioning automático</text>
  <text x="980" y="292" class="t2">refresco cada 5 s</text>
  <path class="lin" d="M860,255 L898,255"/>

  <!-- CONSUMO -->
  <text x="900" y="36" class="tit">3 · CONSUMO</text>
  <rect class="caja" x="900" y="40" width="170" height="90"/>
  <text x="985" y="72" class="t1">Power BI Desktop</text>
  <text x="985" y="92" class="t2">proyecto PBIP (texto)</text>
  <text x="985" y="109" class="t2">gerencia · análisis</text>
  <path class="lin" d="M820,185 C820,120 840,85 898,85"/>
  <text x="850" y="120" class="eti">importa</text>

  <rect class="caja" x="900" y="385" width="170" height="90"/>
  <text x="985" y="417" class="t1">DBeaver</text>
  <text x="985" y="437" class="t2">administración</text>
  <text x="985" y="454" class="t2">y consultas SQL</text>
  <path class="lin" d="M810,325 C810,420 840,430 898,430"/>

  <!-- SIMULADOR -->
  <rect class="caja" x="670" y="385" width="190" height="90"/>
  <text x="765" y="417" class="t1">Simulador (Python)</text>
  <text x="765" y="437" class="t2">una lectura por máquina</text>
  <text x="765" y="454" class="t2">cada 10 s (= 1 hora)</text>
  <path class="lin" d="M765,385 L765,327"/>
  <text x="708" y="360" class="eti">inserta</text>

  <!-- GITHUB -->
  <rect class="caja" x="20" y="385" width="600" height="90"/>
  <text x="320" y="417" class="t1">GitHub · repositorio privado</text>
  <text x="320" y="437" class="t2">scripts SQL · código del ETL · tablero de Grafana (JSON) · proyecto Power BI (PBIP)</text>
  <text x="320" y="454" class="t2">docs · docker-compose.yml · .env.example (el .env no se versiona)</text>
</svg>
